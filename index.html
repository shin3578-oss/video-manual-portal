<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="origin"><!-- YouTube埋め込みはドメイン照合に参照元が要る（no-referrerだとエラー153） -->
<meta name="theme-color" content="#2f4356">
<title>動画マニュアル｜医療法人社団KDS 大崎オーバルコート歯科・矯正歯科室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fff; --soft:#f7f8f9; --ink:#001623; --sub:#5f6b74; --line:#e1e1e1;
  --navy:#2f4356; --acc:#e08b2c; --dark:#2a2a2a; --r:2px;
  --shadow:0 1px 3px rgba(0,22,35,.08);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Segoe UI",Meiryo,sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}

/* ---- 合言葉ゲート ---- */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
#gate .box{width:100%;max-width:420px;text-align:center}
#gate .org{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.16em;margin:0 0 6px}
#gate h1{font-size:26px;margin:0 0 8px;letter-spacing:.02em;font-weight:800}
#gate .clinic{font-size:14px;font-weight:700;margin:0 0 6px}
#gate p{color:var(--sub);font-size:13px;margin:0 0 26px}
#gate .row{display:flex;gap:8px}
#gate input{flex:1;min-width:0;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
#gate input:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:transparent}
#gate button{padding:14px 26px;border:0;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:700;cursor:pointer;letter-spacing:.04em}
#gate .err{color:#c0392b;font-size:13px;height:18px;margin-top:12px}
.brand{display:inline-flex;align-items:center;gap:9px;margin:0 auto 20px}
.brand .mk{width:34px;height:34px;flex:none;display:grid;place-items:center;border:2px solid var(--acc);transform:rotate(45deg);color:var(--ink)}
.brand .mk span{transform:rotate(-45deg);font-size:15px;line-height:1}
.brand .nm{font-weight:800;letter-spacing:.14em;font-size:17px}

/* ---- 共通ヘッダー ---- */
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.nav{display:flex;align-items:center;gap:18px;height:74px}
.nav .brand{margin:0;cursor:pointer}
.nav .sp{margin-left:auto}
.nav a.lnk{text-decoration:none;font-size:14px;font-weight:600;color:var(--ink);opacity:.85;cursor:pointer;white-space:nowrap}
.nav a.lnk:hover{opacity:1;color:var(--acc)}
.nav a.lnk[aria-current=true]{color:var(--acc);opacity:1}
.searchbox{position:relative;width:min(320px,42vw)}
.searchbox input{width:100%;padding:9px 34px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:13.5px}
.searchbox input:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:transparent}
.searchbox .ico{position:absolute;left:10px;top:8px;color:var(--sub);font-size:14px;pointer-events:none}
.searchbox .clr{position:absolute;right:4px;top:4px;width:26px;height:26px;border:0;background:none;color:var(--sub);cursor:pointer;display:none}
.searchbox .clr.on{display:block}

/* ---- ヒーロー帯 ---- */
.hero{background:var(--navy);color:#fff;text-align:center;padding:64px 24px}
.hero h1{font-size:34px;font-weight:800;margin:0 0 14px;letter-spacing:.02em;line-height:1.4}
.hero .sub{font-size:14px;opacity:.85;margin:0}
.hero .brand{margin-top:22px;color:#fff}
.hero .brand .mk{border-color:var(--acc);color:#fff}
.btn{display:inline-block;padding:13px 30px;border:2px solid var(--ink);border-radius:var(--r);background:transparent;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;letter-spacing:.03em}
.btn:hover{background:var(--ink);color:#fff}
.btn.fill{background:var(--ink);color:#fff}
.btn.fill:hover{background:var(--acc);border-color:var(--acc)}
.btn.onnavy{border-color:#fff;color:#fff}
.btn.onnavy:hover{background:#fff;color:var(--navy)}
.hero .btn{margin-top:26px}

/* ---- ライブラリ ---- */
main{max-width:1180px;margin:0 auto;padding:0 24px 90px}
.libhead{display:flex;align-items:flex-start;gap:24px;padding:56px 0 26px;flex-wrap:wrap}
.libhead h2{font-size:26px;font-weight:800;margin:0;letter-spacing:.02em}
.resume{margin-left:auto;display:flex;align-items:center;gap:14px;text-align:right;cursor:pointer;max-width:520px;text-decoration:none}
.resume .lab{font-size:13px;font-weight:700;letter-spacing:.04em}
.resume .ttl{font-size:13px;color:var(--sub);line-height:1.5}
.resume img{width:132px;flex:none;border:1px solid var(--line)}
.resume:hover .lab{color:var(--acc)}

.courses{display:flex;flex-direction:column;gap:22px}
.course{display:flex;align-items:stretch;gap:0;background:var(--soft);border-top:3px solid var(--acc);text-align:left;padding:0;width:100%;cursor:pointer;border-left:0;border-right:0;border-bottom:0}
.course:hover{box-shadow:var(--shadow)}
.course .th{width:310px;flex:none;background:#fff;aspect-ratio:16/9;overflow:hidden;position:relative}
.course .th img{width:100%;height:100%;object-fit:cover;display:block}
.course .mid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px 30px;text-align:center}
.course .nm{font-size:19px;font-weight:800;line-height:1.5}
.course .cta{flex:none;display:flex;align-items:center;padding:0 34px 0 0}
.course .n{font-size:12px;color:var(--sub);letter-spacing:.04em}
.bar{height:4px;background:#e5e5e5;width:100%;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}

/* ---- パンくず ---- */
.crumb{font-size:12.5px;color:var(--sub);padding:26px 0 0;line-height:1.9}
.crumb a{text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--acc)}

/* ---- コース画面 ---- */
.cols{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start;padding-top:34px}
.sect{background:var(--soft);padding:30px 34px}
.sect h3{font-size:19px;font-weight:800;margin:0 0 6px}
.sect .cnt{font-size:12px;color:var(--sub);margin:0 0 18px;letter-spacing:.04em}
.lesson{display:flex;align-items:center;gap:20px;text-decoration:none;padding:16px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.lesson:first-of-type{border-top:0}
.lesson:hover .lt{color:var(--acc)}
.lesson .th{width:104px;flex:none;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);overflow:hidden}
.lesson .th img{width:100%;height:100%;object-fit:cover;display:block}
.lesson .lb{flex:1;min-width:0}
.lesson .lt{font-size:14.5px;font-weight:700;line-height:1.6}
.lesson .lm{font-size:11.5px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.lesson .ck{width:22px;flex:none;text-align:center;color:var(--acc);font-size:15px;opacity:0}
.lesson.done .ck{opacity:1}
.lesson.done .lt{color:var(--sub)}
.side{position:sticky;top:98px;border-top:3px solid var(--acc);background:var(--bg);box-shadow:var(--shadow)}
.side .th{aspect-ratio:16/9;overflow:hidden;background:var(--soft)}
.side .th img{width:100%;height:100%;object-fit:cover;display:block}
.side .in{padding:20px 22px 24px}
.side .st{font-size:14px;font-weight:800;margin:0 0 12px}

/* ---- レッスン画面 ---- */
.lespane{display:grid;grid-template-columns:1fr 300px;gap:0;padding-top:18px}
.player{aspect-ratio:16/9;background:#000;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.tocwrap{position:relative}
.toc{position:absolute;inset:0;background:var(--dark);color:#fff;overflow-y:auto}
.toc .hd{display:flex;align-items:center;gap:10px;padding:16px 18px;position:sticky;top:0;background:var(--dark);border-bottom:1px solid #3a3a3a}
.toc .hd b{font-size:13.5px;font-weight:800;flex:1;min-width:0}
.toc .hd span{font-size:11.5px;opacity:.7;white-space:nowrap}
.toc .row{display:flex;align-items:center;gap:11px;text-decoration:none;padding:11px 16px;cursor:pointer;background:none;border:0;width:100%;text-align:left;color:#fff}
.toc .row:hover{background:#353535}
.toc .row.on{background:#3d3d3d}
.toc .row .no{width:14px;flex:none;font-size:11.5px;opacity:.75;text-align:center;font-variant-numeric:tabular-nums}
.toc .row.on .no{color:var(--acc);opacity:1}
.toc .row img{width:56px;flex:none;aspect-ratio:16/9;object-fit:cover;background:#111}
.toc .row .tt{flex:1;min-width:0;font-size:12px;line-height:1.5}
.toc .row .dn{flex:none;color:var(--acc);font-size:12px;opacity:0}
.toc .row.done .dn{opacity:1}
.lesbody{max-width:832px;padding:30px 0 0}
.markbtn{width:100%;padding:15px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;border-radius:var(--r);letter-spacing:.03em}
.markbtn:hover{background:var(--ink);color:#fff}
.markbtn.done{background:var(--acc);border-color:var(--acc);color:#fff}
.lesbody h2{font-size:24px;font-weight:800;margin:26px 0 6px;line-height:1.5}
.lesbody .cs{font-size:14px;font-weight:700;color:var(--sub);margin:0 0 18px}
.lesbody pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;color:var(--sub);margin:0;background:var(--soft);padding:18px 20px;border-radius:var(--r)}
.acts{display:flex;gap:10px;margin:22px 0 0;flex-wrap:wrap}
.acts button,.acts a{padding:10px 18px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.acts button:hover,.acts a:hover{border-color:var(--ink)}
.acts .fav.on{color:var(--acc);border-color:var(--acc);font-weight:700}
.pager{display:flex;gap:12px;margin:34px 0 0;border-top:1px solid var(--line);padding-top:22px}
.pager a{flex:1;text-decoration:none;font-size:13px;padding:14px 16px;background:var(--soft);cursor:pointer;line-height:1.5}
.pager a:hover{background:#eef0f2}
.pager a.nx{text-align:right}
.pager a b{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.06em;margin-bottom:3px;font-weight:700}
.pager .void{flex:1}

/* ---- 検索結果 ---- */
.res{display:flex;flex-direction:column;margin-top:10px}
.empty{text-align:center;color:var(--sub);padding:70px 20px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:8px}
mark{background:#ffe9a8;color:inherit;padding:0 1px}

footer{background:var(--navy);color:#fff}
footer .wrap{padding:30px 24px;font-size:12px;line-height:1.9;text-align:center;opacity:.92}
footer a{color:#fff}

@media(max-width:900px){
  .cols,.lespane{grid-template-columns:1fr}
  .tocwrap{position:static}
  .toc{position:static;max-height:340px}
  .side{position:static}
  .course{flex-wrap:wrap}
  .course .th{width:100%}
  .course .mid{padding:20px}
  .course .cta{padding:0 20px 22px;width:100%;justify-content:center}
  .hero{padding:46px 20px}
  .hero h1{font-size:25px}
  .libhead{padding:36px 0 22px}
  .resume{margin-left:0;width:100%;text-align:left;flex-direction:row-reverse;justify-content:flex-end}
  .nav{height:auto;padding:12px 0;flex-wrap:wrap;gap:12px}
  .searchbox{width:100%;order:9}
  .wrap,main{padding-left:16px;padding-right:16px}
  .sect{padding:22px 18px}
  .lesson .th{width:82px}
}
</style>
</head>

  <div class="box">

</div>

<div id="app" hidden>

const LS = {pw:"vm_pw", fav:"vm_fav", hist:"vm_hist", done:"vm_done", pos:"vm_pos"};
const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2a(ENC.salt), iterations:200000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2a(ENC.iv)}, key, b2a(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---- 検索用の正規化：カタカナ→ひらがな、全角→半角、小文字化 ---- */
function norm(s){
  return (s||"").normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[ 　\-–—・.,、。（）()【】\[\]「」]/g, "");
}

let DATA=null, V=[], COURSES=[], BYID={}, q="";
const fav  = new Set(JSON.parse(localStorage.getItem(LS.fav)||"[]"));
const done = new Set(JSON.parse(localStorage.getItem(LS.done)||"[]"));
let hist = JSON.parse(localStorage.getItem(LS.hist)||"[]");
let pos  = JSON.parse(localStorage.getItem(LS.pos)||"{}");   // 動画ID→視聴率(0〜1)
const save = () => {
  localStorage.setItem(LS.fav, JSON.stringify([...fav]));
  localStorage.setItem(LS.hist, JSON.stringify(hist));
  localStorage.setItem(LS.done, JSON.stringify([...done]));
  localStorage.setItem(LS.pos, JSON.stringify(pos));
};
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb = id => "https://i.ytimg.com/vi/"+id+"/mqdefault.jpg";
const pct = v => done.has(v.i) ? 1 : (pos[v.i]||0);

function hl(t){
  if(!q) return esc(t);
  const ws = q.split(/\s+/).filter(Boolean); let out = esc(t);
  ws.forEach(w => {const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"); out = out.replace(re, m => "<mark>"+m+"</mark>");});
  return out;
}

function boot(d){
  DATA = d;
  V = d.videos.map(v => ({...v, _n: norm(v.t+" "+v.d+" "+v.c)}));
  V.forEach(v => BYID[v.i] = v);
  COURSES = d.cats.map((c,ci) => {
    const vs = V.filter(v => v.c===c);
    vs.forEach((v,li) => {v._ci = ci; v._li = li;});
    return {name:c, ci, vs};
  }).filter(c => c.vs.length);
  $("#gate").remove(); $("#app").hidden = false;
  $("#upd").textContent = "最終更新 " + ENC.built + "　／　収録 " + V.length + "本";
  $("#home").onclick = () => go("");
  $("#navlib").onclick = () => go("");
  $("#navfav").onclick = () => go("/fav");
  $("#q").oninput = e => {
    q = norm(e.target.value);
    $("#clr").classList.toggle("on", !!e.target.value);
    if(q){ if(!location.hash.startsWith("#/search")) history.pushState(null,"","#/search"); route(); }
    else go("");
  };
  $("#clr").onclick = () => {$("#q").value=""; q=""; $("#clr").classList.remove("on"); go(""); $("#q").focus();};
  addEventListener("hashchange", route);
  route();
}

const go = h => {
  if(location.hash.replace(/^#/, "") === h){ route(); return; }
  location.hash = h;
};

/* ---- ルーター ---- */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  stopWatch();
  const m = /^\/c\/(\d+)$/.exec(h), mv = /^\/v\/([\w-]+)$/.exec(h);
  if(mv && BYID[mv[1]])      viewLesson(BYID[mv[1]]);
  else if(m && COURSES.find(c => c.ci === +m[1])) viewCourse(COURSES.find(c => c.ci === +m[1]));
  else if(h === "/search")   viewSearch();
  else if(h === "/fav")      viewFav();
  else                       viewLibrary();
  $("#navlib").setAttribute("aria-current", String(!h || h==="/"));
  $("#navfav").setAttribute("aria-current", String(h==="/fav"));
  scrollTo(0,0);
}

const barHTML = r => '<div class="bar"><i style="width:'+Math.round(r*100)+'%"></i></div>';

/* ---- ① ライブラリ（コース一覧） ---- */
function viewLibrary(){
  const last = hist.map(id => BYID[id]).find(Boolean);
  const resume = last ? '<a class="resume" href="#/v/'+last.i+'">'
      + '<div><div class="lab">続きから</div><div class="ttl">'+esc(COURSES[last._ci].name)+' - '+esc(last.t)+'</div></div>'
      + '<img loading="lazy" src="'+thumb(last.i)+'" alt=""></a>' : "";
  const cards = COURSES.map(c => {
    const n = c.vs.filter(v => done.has(v.i)).length;
    const started = n>0 || c.vs.some(v => (pos[v.i]||0)>0);
    return '<button class="course" data-ci="'+c.ci+'">'
      + '<div class="th"><img loading="lazy" src="'+thumb(c.vs[0].i)+'" alt=""></div>'
      + '<div class="mid"><div class="nm">'+esc(c.name)+'</div>'
      + barHTML(n/c.vs.length)
      + '<div class="n">'+n+' / '+c.vs.length+' 本 視聴済み</div></div>'
      + '<div class="cta"><span class="btn fill">'+(started?"続きから":"受講する")+'</span></div></button>';
  }).join("");
  render(
    '<div class="hero"><h1>動画マニュアル</h1><p class="sub">医療法人社団KDS　大崎オーバルコート歯科・矯正歯科室</p>'
    + '<div class="brand"><span class="mk"><span>&#9654;</span></span><span class="nm">KDS</span></div></div>'
    + '<main><div class="libhead"><h2>マイコース</h2>'+resume+'</div>'
    + '<div class="courses">'+cards+'</div></main>');
  document.querySelectorAll(".course").forEach(b => b.onclick = () => go("/c/"+b.dataset.ci));
}

/* ---- ② コース（レッスン一覧） ---- */
function viewCourse(c){
  const n = c.vs.filter(v => done.has(v.i)).length;
  const next = c.vs.find(v => !done.has(v.i)) || c.vs[0];
  render(
    '<div class="hero"><h1>'+esc(c.name)+'</h1>'
    + '<a class="btn onnavy" href="#/v/'+next.i+'">'+(n?"続きから見る":"最初から見る")+'</a></div>'
    + '<main><div class="crumb"><a href="#">動画マニュアル</a> / '+esc(c.name)+'</div>'
    + '<div class="cols"><div class="sect"><h3>'+esc(c.name)+'</h3>'
    + '<p class="cnt">'+c.vs.length+' 本の動画</p>'
    + c.vs.map((v,i) =>
        '<a class="lesson'+(done.has(v.i)?" done":"")+'" href="#/v/'+v.i+'">'
        + '<span class="ck">&#10003;</span>'
        + '<div class="th"><img loading="lazy" src="'+thumb(v.i)+'" alt=""></div>'
        + '<div class="lb"><div class="lt">'+String(i+1).padStart(2,"0")+'. '+esc(v.t)+'</div>'
        + '<div class="lm">'+v.l+'　'+v.y+'</div>'
        + ((pos[v.i]&&!done.has(v.i)) ? barHTML(pos[v.i]) : '')
        + '</div></a>').join("")
    + '</div>'
    + '<div class="side"><div class="th"><img loading="lazy" src="'+thumb(c.vs[0].i)+'" alt=""></div>'
    + '<div class="in"><div class="st">'+n+' / '+c.vs.length+' 本 視聴済み</div>'+barHTML(n/c.vs.length)+'</div></div>'
    + '</div></main>');
}

/* ---- ③ レッスン（動画） ---- */
function viewLesson(v){
  const c = COURSES[v._ci], i = v._li;
  const prev = c.vs[i-1], next = c.vs[i+1];
  hist = [v.i, ...hist.filter(x => x!==v.i)].slice(0,40); save();
  render(
    '<main><div class="crumb"><a href="#">動画マニュアル</a> / <a href="#/c/'+c.ci+'">'+esc(c.name)+'</a> / '+esc(v.t)+'</div>'
    + '<div class="lespane"><div class="player" id="player"></div>'
    + '<div class="tocwrap"><div class="toc"><div class="hd"><b>'+esc(c.name)+'</b><span>'+c.vs.length+' 本</span></div>'
    + c.vs.map((x,ix) =>
        '<a class="row'+(x.i===v.i?" on":"")+(done.has(x.i)?" done":"")+'" href="#/v/'+x.i+'">'
        + '<span class="no">'+(x.i===v.i?"&#9654;":ix+1)+'</span>'
        + '<img loading="lazy" src="'+thumb(x.i)+'" alt="">'
        + '<span class="tt">'+String(ix+1).padStart(2,"0")+'. '+esc(x.t)+'</span>'
        + '<span class="dn">&#10003;</span></a>').join("")
    + '</div></div></div>'
    + '<div class="lesbody">'
    + '<button class="markbtn'+(done.has(v.i)?" done":"")+'" id="mark"></button>'
    + '<h2>'+String(i+1).padStart(2,"0")+'. '+esc(v.t)+'</h2>'
    + '<p class="cs">'+esc(c.name)+'　/　'+v.l+'　/　'+v.y+'</p>'
    + (v.d ? '<pre>'+esc(v.d)+'</pre>' : '')
    + '<div class="acts"><button class="fav'+(fav.has(v.i)?" on":"")+'" id="fv"></button>'
    + '<a href="https://www.youtube.com/watch?v='+v.i+'" target="_blank" rel="noopener">YouTubeで開く</a>'
    + '<button id="cp">リンクをコピー</button></div>'
    + '<div class="pager">'
    + (prev ? '<a href="#/v/'+prev.i+'"><b>&#8592; 前の動画</b>'+esc(prev.t)+'</a>' : '<span class="void"></span>')
    + (next ? '<a class="nx" href="#/v/'+next.i+'"><b>次の動画 &#8594;</b>'+esc(next.t)+'</a>' : '<span class="void"></span>')
    + '</div></div></main>');

  startWatch(v);

  const mk = $("#mark");
  const syncMk = () => {
    mk.textContent = done.has(v.i) ? "✓ 視聴済み" : "視聴済みにする";
    mk.classList.toggle("done", done.has(v.i));
  };
  mk.onclick = () => {done.has(v.i) ? done.delete(v.i) : done.add(v.i); save(); syncMk(); refreshMarks(v);};
  syncMk();

  const fv = $("#fv");
  const syncFv = () => {fv.textContent = fav.has(v.i) ? "★ お気に入り済み" : "☆ お気に入りに追加"; fv.classList.toggle("on", fav.has(v.i));};
  fv.onclick = () => {fav.has(v.i) ? fav.delete(v.i) : fav.add(v.i); save(); syncFv();};
  syncFv();

  $("#cp").onclick = async () => {
    try{ await navigator.clipboard.writeText("https://www.youtube.com/watch?v="+v.i);
         $("#cp").textContent = "コピーしました"; setTimeout(()=>$("#cp").textContent="リンクをコピー",1600);
    }catch(_){ $("#cp").textContent = "コピーできません"; }
  };
}

/* 視聴済みの印だけを付け替える（画面を作り直さない） */
function refreshMarks(v){
  const on = done.has(v.i);
  document.querySelectorAll('.toc .row').forEach(r => {
    if(r.getAttribute("href") === "#/v/"+v.i) r.classList.toggle("done", on);
  });
}

/* ---- 検索結果／お気に入り ---- */
function rowsHTML(list){
  return list.map(v =>
    '<a class="lesson'+(done.has(v.i)?" done":"")+'" href="#/v/'+v.i+'">'
    + '<span class="ck">&#10003;</span>'
    + '<div class="th"><img loading="lazy" src="'+thumb(v.i)+'" alt=""></div>'
    + '<div class="lb"><div class="lt">'+hl(v.t)+'</div>'
    + '<div class="lm">'+esc(v.c)+'　/　'+v.l+'</div></div></a>').join("");
}
function viewSearch(){
  const ws = q.split(/\s+/).filter(Boolean);
  const list = ws.length ? V.filter(v => ws.every(w => v._n.includes(w))) : [];
  render('<main><div class="libhead"><h2>検索結果</h2></div>'

}
function viewFav(){

/* ---- YouTube再生と視聴率の記録 ---- */
let player=null, timer=null, apiReady=null;
function loadAPI(){
  if(apiReady) return apiReady;
  apiReady = new Promise(res => {
    if(window.YT && YT.Player) return res(true);
    window.onYouTubeIframeAPIReady = () => res(true);
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => res(false);
    document.head.appendChild(s);
    setTimeout(() => res(!!(window.YT && YT.Player)), 6000);
  });
  return apiReady;
}
function plainEmbed(v){
  const el = $("#player"); if(!el) return;
  el.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'+v.i+'?rel=0&autoplay=1&modestbranding=1" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>';
}
async function startWatch(v){
  const ok = await loadAPI();
  const el = $("#player");
  if(!el || location.hash !== "#/v/"+v.i) return;      // 待っている間に画面が変わった
  if(!ok){ plainEmbed(v); return; }
  try{
    player = new YT.Player(el, {
      videoId: v.i, host: "https://www.youtube-nocookie.com",
      playerVars: {rel:0, autoplay:1, modestbranding:1},
      events: {onStateChange: e => {
        if(e.data === YT.PlayerState.ENDED){ done.add(v.i); save(); markSelf(v); }
      }}
    });
    timer = setInterval(() => {
      try{
        const d = player.getDuration(), t = player.getCurrentTime();
        if(!d) return;
        const r = Math.min(1, t/d);
        if(r > (pos[v.i]||0)) pos[v.i] = r;
        if(r >= .9 && !done.has(v.i)){ done.add(v.i); markSelf(v); }
        save();
      }catch(_){}
    }, 5000);
  }catch(_){ plainEmbed(v); }
}
function markSelf(v){
  const mk = $("#mark");
  if(mk){ mk.textContent = "✓ 視聴済み"; mk.classList.add("done"); }
  refreshMarks(v);
}
function stopWatch(){
  if(timer){ clearInterval(timer); timer = null; }
  if(player && player.destroy){ try{ player.destroy(); }catch(_){} }
  player = null;
}

/* ---- ゲート ---- */
async function tryPw(pw, remember){
  try{
    const d = await unlock(pw);
    if(remember) localStorage.setItem(LS.pw, pw);
    boot(d); return true;
  }catch(_){ return false; }
}
(async () => {
  const saved = localStorage.getItem(LS.pw);
  if(saved && await tryPw(saved, false)) return;
  // 保存済みの合言葉が通らない＝院長が合言葉を入れ替えた直後。何が起きたか画面で伝える
  if(saved){
    localStorage.removeItem(LS.pw);
    $("#err").textContent = "合言葉が新しくなりました";
    $("#gate").querySelector("p").innerHTML +=
      "<br><b>合言葉が変更されました。</b>院長から共有された新しい合言葉を入れてください";
  }
  const go2 = async () => {
    const pw = $("#pw").value.trim();
    if(!pw) return;
    $("#err").textContent = "確認中…";
    if(!await tryPw(pw, true)){ $("#err").textContent = "合言葉が違います"; $("#pw").select(); }
  };
  $("#go").onclick = go2;
  $("#pw").onkeydown = e => {if(e.key==="Enter") go2();};
  $("#pw").focus();
})();
</script>
